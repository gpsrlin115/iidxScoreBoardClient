<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>IIDX 영상 공유</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#050813;color:#eceaf4;font:14px sans-serif}
    body{display:flex;flex-direction:column}p{margin:0;padding:8px 12px}
    #stage{min-height:0;flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden}
    #frame{position:relative;box-sizing:border-box;width:min(100%,calc((100vh - 60px)*16/9));max-height:100%;aspect-ratio:16/9;padding:14px;background:#050813}
    #frame iframe{display:block;width:100%;height:100%;border:0}
    .mark{position:absolute;width:14px;height:14px;pointer-events:none}
    .tl{top:0;left:0;background:#ff00ff}.tr{top:0;right:0;background:#00ff50}
    .bl{bottom:0;left:0;background:#00d2ff}.br{bottom:0;right:0;background:#ffeb00}
  </style>
</head>
<body>
  <p id="guide">영상을 재생한 뒤 ScoreBoard에서 이 창을 공유하세요. 창 크기를 고정하고 재생을 유지하세요.</p>
  <div id="stage"><div id="frame"><span class="mark tl" aria-hidden="true"></span><span class="mark tr" aria-hidden="true"></span><span class="mark bl" aria-hidden="true"></span><span class="mark br" aria-hidden="true"></span></div></div>
  <script type="module" src="/layout-analysis-player.js"></script>
</body>
</html>
